<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    </head>
    <title>Botones</title>
    <body>
        <!-- Ambos funcionan para lo mismo pero input submit se usará solo para formularios -->
        <input type="submit" value="Enviar con input"/>

        <!-- La etiqueta button es más flexible -->
        <button type="submit">Enviar</button>
    </body>
</html>
